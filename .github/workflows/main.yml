name: Download, Extract, and Run Python Script

on: 
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. (تعديل) تثبيت أداة 7zip بدلاً من unzip
      - name: Install 7zip
        run: sudo apt-get install p7zip-full -y

      # 2. تحميل الملف المضغوط (ضع الرابط الخاص بك الذي ظهر في الصورة)
      - name: Download ZIP file
        run: wget -O my_files.zip "https://github.com/ahmep1642013n-del/tast-log/releases/download/26fs/daw26.zip"

      # 3. (تعديل) فك الضغط باستخدام 7zip
      - name: Extract ZIP file
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }} 
        run: 7z x -p"$ZIP_PASSWORD" my_files.zip -y

      # 4. إعداد بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 5. تحميل وتثبيت المكتبات من requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. تشغيل السكريبت الرئيسي
      - name: Run main.py
        run: python main.py
