name: Download, Extract, and Run Python Script

on: 
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كل ملفات المستودع (requirements.txt و devices.json وغيرها)
      - name: Checkout repository files
        uses: actions/checkout@v4

      # 2. تثبيت أداة 7zip لفك التشفير
      - name: Install 7zip
        run: sudo apt-get install p7zip-full -y

      # 3. تحميل الملف المضغوط داخل نفس المجلد
      - name: Download ZIP file
        run: wget -O my_files.zip "https://github.com/ahmep1642013n-del/tast-log/releases/download/26fs/daw26.zip"

      # 4. فك ضغط الملفات جنب ملفات المستودع في نفس المكان
      - name: Extract ZIP file
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }} 
        run: 7z x -p"$ZIP_PASSWORD" my_files.zip -y

      # 5. إعداد بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 6. تثبيت المكاتب من requirements.txt (الآن موجود جنبه رسميًا)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. تشغيل السكريبت وجميع الملفات موجودة في نفس المسار
      - name: Run main.py
        run: python main.py
